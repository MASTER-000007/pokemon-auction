<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>{% block title %}Pokémon Auction{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23ff3b3b'/><path d='M4 50h92' stroke='%23000' stroke-width='8'/><circle cx='50' cy='50' r='16' fill='%23fff' stroke='%23000' stroke-width='8'/></svg>">
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

<header class="topbar">
  <a class="brand" href="{{ url_for('main.index') }}">
    <span class="brand-ball"></span>
    <span class="brand-text">Pokémon <b>Auction</b></span>
  </a>
  <div class="topbar-right">
    {% block topbar_right %}{% endblock %}
    <span class="conn-dot" id="connDot" title="Connection status"></span>
  </div>
</header>

<main class="page">
  {% block content %}{% endblock %}
</main>

<div id="toasts" class="toasts"></div>

{% block scripts %}{% endblock %}
</body>
</html>
